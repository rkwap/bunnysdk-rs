name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --locked
      - run: cargo doc --no-deps --locked

  # Generated code must match the vendored specs and the generator.
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask codegen
      - name: Check generated code is up to date
        run: git diff --exit-code -- src/generated

  # Each API feature must build on its own.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --locked --no-default-features
      - run: |
          for feature in core compute shield stream containers database origin-errors storage logging; do
            echo "::group::$feature"
            cargo check --lib --locked --no-default-features --features "$feature"
            echo "::endgroup::"
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --locked

  # Runs against real bunny.net only when the secrets are configured.
  live:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
      BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
      BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
      BUNNY_STORAGE_REGION: ${{ secrets.BUNNY_STORAGE_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core smoke test (read-only)
        if: env.BUNNY_API_KEY != ''
        run: cargo test --locked --test live core_ -- --ignored
      - name: Storage smoke test
        if: env.BUNNY_STORAGE_PASSWORD != ''
        run: cargo test --locked --test live storage_ -- --ignored
